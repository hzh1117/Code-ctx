name: Provider Smoke

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run provider compatibility smoke tests
        env:
          RUN_PROVIDER_SMOKE: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_SMOKE_MODEL: ${{ secrets.OPENAI_SMOKE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_SMOKE_MODEL: ${{ secrets.ANTHROPIC_SMOKE_MODEL }}
        run: npm test -- tests/smoke/provider-smoke.test.js --runInBand
