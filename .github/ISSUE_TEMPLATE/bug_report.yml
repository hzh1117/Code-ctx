name: Bug report / Bug 反馈
description: Report a reproducible problem in Code-ctx / 反馈可复现的问题
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets, private code, and API keys before submitting. Do not use public issues for sensitive security reports; use the Security advisory flow or SECURITY.md.

        感谢反馈问题。提交前请移除密钥、私有代码和 API Key。敏感安全问题不要公开提交，请使用安全公告流程或 SECURITY.md。
  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题摘要
      description: What went wrong? / 出现了什么问题？
      placeholder: Describe the bug clearly. / 请清晰描述这个 bug。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: List the smallest steps that reproduce the issue. / 请提供最小复现步骤。
      placeholder: |
        1. Run `code-ctx ...` / 运行 `code-ctx ...`
        2. Open ... / 打开 ...
        3. See ... / 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include logs or screenshots when useful. / 如有必要，请附上日志或截图。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Code-ctx version / Code-ctx 版本
      description: Run `code-ctx --version`, or provide the commit hash for a source checkout. / 运行 `code-ctx --version`；源码检出请提供 commit hash。
      placeholder: '1.0.0 or 260de7c'
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface / 使用入口
      options:
        - CLI
        - Dashboard
        - Programmatic API
        - Plugin
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version / Node.js 版本
      placeholder: 'v20.12.0'
    validations:
      required: true
  - type: input
    id: npm
    attributes:
      label: npm version / npm 版本
      placeholder: '10.5.0'
  - type: input
    id: os
    attributes:
      label: Operating system / 操作系统
      placeholder: 'Windows 11, macOS 15, Ubuntu 24.04'
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics / 脱敏诊断
      description: Include the error code and sanitized `code-ctx doctor --strict` output when relevant. Do not paste config contents, prompts, provider responses, API keys, or absolute paths. / 如适用，请提供错误码和脱敏后的 `code-ctx doctor --strict` 输出。不要粘贴配置内容、Prompt、Provider 响应、API Key 或绝对路径。
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Additional context / 其他信息
