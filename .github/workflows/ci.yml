name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this matrix aligned with package.json engines (Node >=20).
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install CLI dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: web

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check JavaScript
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run coverage
        run: npm run coverage

      - name: Build dashboard
        run: npm run build:web

      - name: Test published package
        run: npm run pack:smoke

  windows-smoke:
    name: Windows smoke (Node.js 20)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm

      - name: Install CLI dependencies
        run: npm ci

      - name: Test published package
        run: npm run pack:smoke

      - name: Run Windows CLI smoke tests
        run: npm test -- tests/bin/cli-help.test.js tests/utils/clipboard.test.js tests/smoke/package-scripts.test.js --runInBand

  audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm

      - name: Audit CLI dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit dashboard dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: web
